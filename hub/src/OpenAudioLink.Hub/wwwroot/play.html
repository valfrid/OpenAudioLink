<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OpenAudioLink</title>
<link rel="stylesheet" href="oal.css">
</head>
<body>
<!--
  The portal.

  One question: what do you want to listen to. Answering it opens the app
  for that kind of source, and the app asks the second question — which
  station, which turntable — and where it should come out.

  This page deliberately does *not* let you start anything. A tile that
  both opened an app and started playing would mean two different things
  happened depending on where you tapped, and the one control on this
  screen that must never be ambiguous is Stop.
-->
<div class="app">
  <header>
    <div class="brand">OpenAudioLink</div>
    <div class="status" id="health"><span class="dot">●</span> <span id="health-text">Connecting…</span></div>
  </header>

  <section class="card banner" id="banner" hidden>
    <div class="what-plays">
      <div class="section-label">Playing now</div>
      <div class="lead" id="playing-lead"></div>
      <div class="sub" id="playing-sub"></div>
    </div>
    <div class="volume-row" style="flex:1;min-width:220px">
      <span>🔈</span>
      <input id="volume" type="range" min="0" max="100" value="50">
      <span>🔊</span>
      <div class="vol-number" id="vol-text">50%</div>
    </div>
    <div class="eq-knobs" id="room-eq" hidden></div>
    <button class="stop" id="stop">■ Stop</button>
  </section>

  <section class="card">
    <h2 style="margin:0 0 4px;font-size:20px">What would you like to hear?</h2>
    <div class="footer-note" style="margin:0 0 18px" id="destination-note"></div>
    <div class="apps" id="apps"></div>
  </section>

  <div class="footer-note">
    <a href="index.html" style="color:var(--muted)">Setup and diagnostics</a>
    — devices, roles, firmware. Not needed to play anything.
  </div>
</div>

<script src="oal.js"></script>
<script>
  const $ = id => document.getElementById(id);

  /*
   * The apps, in the order somebody is likely to want them. Each one
   * declares how to tell whether it has anything to offer, so a tile can
   * say "no stations yet" instead of opening onto an empty page.
   */
  const APPS = [
    {
      id: 'radio', href: 'radio.html', glyph: '📻', name: 'Internet Radio',
      what: 'Stations from anywhere, played by the Hub.',
      ready: state => state.hub
        ? (state.stations.length ? null : 'No stations saved yet — add one inside')
        : 'The Hub is not in the device list',
      isLive: state => state.playing && state.stream?.source === 'radio',
    },
    {
      id: 'vinyl', href: 'vinyl.html', glyph: '💿', name: 'Vinyl or microphone',
      what: 'Whatever is plugged into a node’s input.',
      ready: state => state.lineIn.length ? null : 'No node with an input is online',
      isLive: state => state.playing && state.playing.source === 'capture',
    },
    {
      id: 'spotify', href: 'spotify.html', glyph: '🟢', name: 'Spotify',
      what: 'Choose the room in the Spotify app on your phone.',
      ready: state => state.castPoints.some(p => p.receiver?.offered)
        ? null : 'No room is being offered to Spotify',
      isLive: state => state.castPoints.some(p => p.receiver?.playing),
    },
  ];

  let state = null;
  let room = null;   // The cast point an NFC sticker asked for, if any.

  const sendVolume = OAL.volumeSender(
    () => state?.playing?.id ?? null,
    message => setHealth(message, true));

  function setHealth(text, bad) {
    $('health-text').textContent = text;
    $('health').classList.toggle('bad', !!bad);
  }

  function renderApps() {
    $('apps').innerHTML = APPS.map(app => {
      const blocked = app.ready(state);
      const live = app.isLive(state);
      // The room travels with the link, so an app opened from a sticker
      // already knows where the sound should come out.
      const href = room ? `${app.href}#room=${encodeURIComponent(room.id)}` : app.href;
      return `<a class="card app-tile${live ? ' live' : ''}${blocked ? ' off' : ''}" href="${href}">`
        + `<div class="glyph">${app.glyph}</div>`
        + `<div class="name">${OAL.esc(app.name)}</div>`
        + `<div class="what">${blocked ? OAL.esc(blocked) : OAL.esc(app.what)}</div>`
        + (live ? '<div class="what" style="color:var(--accent)">Playing now</div>' : '')
        + `</a>`;
    }).join('');
  }

  function renderBanner() {
    const playing = state.playing;
    $('banner').hidden = !playing;
    if (!playing) return;

    // What is playing, in the words of whatever is producing it. The Hub's
    // stream describes itself ("Internet radio: Groove Salad"); a node
    // producer does not, so the source name is the honest fallback.
    /*
     * "Line in" named one of the two capture stages and got it wrong for
     * the other, which is the third place this assumption had been left --
     * after the link test's source dropdown and the Vinyl app's own copy.
     * The producing node knows which it is; ask it rather than guessing.
     */
    const producer = (state.devices ?? []).find(d => d.id === playing.producer);
    const captureName = producer?.status?.inputStage === 'mic' ? 'Microphone' : 'Line in';
    const description = state.stream?.running
      ? state.stream.description
      : playing.source === 'capture' ? captureName : (playing.source ?? 'Playing');
    $('playing-lead').textContent = description;
    $('playing-sub').textContent = `in ${playing.name}`;

    if (document.activeElement !== $('volume') && typeof playing.volume === 'number') {
      $('volume').value = playing.volume;
      $('vol-text').textContent = OAL.volumeLabel(playing.volume);
    }

    renderRoomEq(playing);
  }

  /*
   * Room correction, on the page that is open while music plays.
   *
   * The switch lives in the setup page too, beside each speaker's
   * coefficients — but that is the page for deciding what a correction
   * should be, and this is the one somebody is holding in the listening
   * chair. Comparing corrected against uncorrected is the only way to know
   * whether a correction helped, and it only happens if the control is
   * where the listening happens.
   *
   * One knob per node, not one for the room. A cast point is usually
   * several ESP32 nodes, each in front of its own loudspeaker with its own
   * correction fitted from its own measurement — so a single switch would
   * change several unrelated things at once, and there would be no way to
   * hear whether the fit for *this* speaker was the good one. Two speakers
   * of a stereo pair are normally flipped together, and with the knobs side
   * by side that is two taps rather than something the page decides.
   */
  function correctable(playing) {
    return (playing?.members ?? []).filter(m => m.hasEq && m.online);
  }

  function renderRoomEq(playing) {
    const speakers = correctable(playing);
    const knobs = $('room-eq');

    // Hidden when no speaker in this room has a correction stored. A
    // switch that would do nothing is worse than no switch.
    knobs.hidden = speakers.length === 0;
    if (knobs.hidden) { knobs.innerHTML = ''; return; }

    /*
     * Rebuilt from the poll every four seconds, so a knob left mid-tap
     * would lose its press. Skipped while one is in flight -- the click
     * handler owns the state until its request comes back.
     */
    if (knobs.dataset.busy === 'true') return;

    /*
     * Named by speaker once the room holds more than one, because three
     * knobs all saying "room correction" are three labels to read and no
     * information. A room of one has nothing to distinguish, so its knob
     * says what it does instead.
     *
     * Counted over the room's members rather than over the correctable
     * ones: in a stereo pair with a node offline, the surviving knob is
     * still one speaker of two, and calling it "room correction" would
     * claim it does something to the other.
     */
    const named = (playing?.members ?? []).length > 1;

    knobs.innerHTML = speakers.map(speaker => {
      const on = speaker.eqEnabled === true;
      const label = named ? speaker.name : 'Room correction';
      return `<button class="eq-knob" data-on="${on}" `
        + `data-device="${OAL.esc(speaker.id)}" `
        + `data-label="${OAL.esc(label)}" `
        + `data-name="${OAL.esc(speaker.name)}" `
        + `title="Room correction on ${OAL.esc(speaker.name)}">`
        + `${on ? '✓' : '○'} ${OAL.esc(label)}</button>`;
    }).join('');
  }

  async function refresh() {
    try {
      state = await OAL.load();
      room = OAL.roomFromUrl(state.castPoints) ?? room;
      setHealth('Hub connected');
      $('destination-note').textContent = room
        ? `This tag chose ${room.name}. The app you pick will play there.`
        : '';
      renderBanner();
      renderApps();
    } catch (error) {
      setHealth(error.message, true);
    }
  }

  $('volume').addEventListener('input', event => {
    const percent = Number(event.target.value);
    $('vol-text').textContent = OAL.volumeLabel(percent);
    sendVolume(percent);
  });

  // Delegated, because the knobs are rebuilt on every poll and a listener
  // bound to one of them would be attached to a button that no longer
  // exists four seconds later.
  $('room-eq').addEventListener('click', async event => {
    const knob = event.target.closest('.eq-knob');
    if (!knob) return;

    const id = knob.dataset.device;
    const wanted = knob.dataset.on !== 'true';

    // Answered immediately rather than at the next poll: a knob that waits
    // four seconds to look pressed gets pressed twice.
    knob.dataset.on = String(wanted);
    knob.textContent = `${wanted ? '✓' : '○'} ${knob.dataset.label}`;
    $('room-eq').dataset.busy = 'true';
    knob.disabled = true;
    try {
      await OAL.api('POST',
        `/api/devices/${encodeURIComponent(id)}/correction/enabled`,
        { enabled: wanted });
      setHealth(`${knob.dataset.name}: room correction ${wanted ? 'on' : 'off'}`);
    } catch (error) {
      setHealth(error.message, true);
    } finally {
      $('room-eq').dataset.busy = 'false';
      knob.disabled = false;
      await refresh();
    }
  });

  $('stop').addEventListener('click', async () => {
    const target = state?.playing?.id;
    if (!target) return;
    $('stop').disabled = true;
    try {
      await OAL.api('POST', `/api/castpoints/${encodeURIComponent(target)}/stop`);
    } catch (error) {
      setHealth(error.message, true);
    } finally {
      $('stop').disabled = false;
      await refresh();
    }
  });

  addEventListener('hashchange', refresh);
  refresh();
  setInterval(refresh, 4000);
</script>
</body>
</html>
