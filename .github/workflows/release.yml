# Publishes a downloadable Hub package and the node firmware.
#
# CI already builds both on every push, but its artifacts need a GitHub
# login to fetch and expire after ninety days. A release asset is a plain
# public URL that never expires, which is what lets the update script be a
# single command with no token and no browser step:
#
#     & "$env:ProgramFiles\OpenAudioLink\scripts\update-hub.ps1"
#
# Triggered by a tag, so publishing is a deliberate act rather than
# something every commit does:
#
#     git tag hub-v0.7.0 && git push origin hub-v0.7.0
#
# The version in the tag must match hub/Directory.Build.props, and this
# refuses the build if it does not — an installer that reports a different
# version from the one on the tin is worse than no installer.
name: Release

# Two kinds of release, because they answer different questions.
#
#   hub-v0.7.0   a deliberate act. Tagged, permanent, the version somebody
#                is told to install.
#   hub-latest   whatever the working branch last built. Moves, marked
#                prerelease, and exists so that upgrading never requires
#                remembering to tag first. This is what makes
#                update-hub.ps1 useful during a week of daily changes.
#
# The rolling one costs nothing: the package is already built on every
# push, and this only publishes it somewhere a script can reach without a
# token. CI artifacts cannot be — they need a login and expire after
# ninety days.
on:
  push:
    tags:
      - "hub-v*"
    branches:
      - main
      - "claude/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Node firmware, published beside the Hub so the Hub can fetch it the same
  # way it fetches itself: a release asset is a public URL, and a CI artifact
  # needs a login and expires. That is the difference between "press Update"
  # and "find the right zip on a laptop, unpack it, upload it".
  #
  # Its own version, from firmware/testnode/version.txt, because a node and
  # the Hub are released independently and always have been. The two live in
  # one release only because a release is a convenient place to put files.
  firmware:
    name: Node firmware (esp32s3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Read the firmware version
        id: version
        run: echo "version=$(cat firmware/testnode/version.txt | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"
      - name: Build with ESP-IDF
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.3.1
          target: esp32s3
          path: firmware/testnode
          command: >
            idf.py build &&
            cd build &&
            esptool.py --chip esp32s3 merge_bin
            -o testnode-esp32s3-flash.bin @flash_args &&
            cp oal_testnode.bin testnode-esp32s3-ota.bin
      - name: Name the files after what is in them
        run: |
          v="${{ steps.version.outputs.version }}"
          mkdir -p release
          cp firmware/testnode/build/testnode-esp32s3-ota.bin   "release/testnode-esp32s3-$v-ota.bin"
          cp firmware/testnode/build/testnode-esp32s3-flash.bin "release/testnode-esp32s3-$v-flash.bin"
          # So a Hub can say which build it holds without opening it.
          ( cd release && sha256sum *.bin > testnode-esp32s3-$v.sha256 )
      - uses: actions/upload-artifact@v5
        with:
          name: firmware-release-files
          path: release/
          if-no-files-found: error

  hub:
    name: Hub win-x64 package
    runs-on: windows-latest
    # The release carries both, so both have to exist before it is cut.
    needs: firmware
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"

      - name: Work out what is being published
        shell: pwsh
        run: |
          $props = Get-Content hub/Directory.Build.props -Raw
          if ($props -notmatch '<Version>([^<]+)</Version>') { throw 'No <Version> in Directory.Build.props' }
          $declared = $Matches[1]

          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            # A tagged release is a promise about a version number, so the
            # tag and the tree have to agree. An installer that reports a
            # different version from the one on the tin is worse than no
            # installer.
            $tagged = $env:GITHUB_REF_NAME -replace '^hub-v', ''
            if ($tagged -ne $declared) {
              throw "Tag says $tagged and hub/Directory.Build.props says $declared. Bump one of them."
            }
            "tag=$env:GITHUB_REF_NAME"        | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            "name=Hub $declared"              | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            "prerelease=false"                | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          }
          else {
            # The rolling one. Named with the version and the commit so the
            # releases page says what it is, but always the same tag so it
            # replaces itself rather than accumulating.
            $short = $env:GITHUB_SHA.Substring(0, 7)
            "tag=hub-latest"                              | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            "name=Hub $declared (latest, $short)"         | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            "prerelease=true"                             | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          }
          "version=$declared" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
        id: version

      # Windows has no Ogg demuxer, and the FLAC internet radio serves is
      # Ogg-FLAC — so without this the Hub cannot play the stations FLAC
      # was added for. See the same step in ci.yml for the full reasoning.
      # Built rather than committed: a binary in a public repository is a
      # thing nobody can review.
      - name: Build libFLAC with Ogg support
        shell: pwsh
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install libflac:x64-windows
          if ($LASTEXITCODE -ne 0) { throw "vcpkg could not build libFLAC" }

      - name: Publish self-contained win-x64
        run: >
          dotnet publish src/OpenAudioLink.Hub --configuration Release
          --runtime win-x64 --self-contained true
          -p:PublishSingleFile=true
          --output publish
        working-directory: hub

      - name: Include the install and update scripts
        run: Copy-Item -Path scripts -Destination publish\scripts -Recurse
        working-directory: hub

      - name: Include libFLAC beside the Hub
        shell: pwsh
        run: |
          $root = "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows"
          Copy-Item "$root\bin\FLAC.dll" hub\publish
          Copy-Item "$root\bin\ogg.dll" hub\publish

          # A release without the licence beside the binary is not one to
          # publish, so this throws rather than warns.
          $copyright = Get-ChildItem "$root\share" -Recurse -Filter copyright |
            Where-Object { $_.FullName -match 'flac' } | Select-Object -First 1
          if (-not $copyright) { throw "No libFLAC copyright file found under $root\share" }
          Copy-Item $copyright.FullName hub\publish\libFLAC-LICENSE.txt

          # The zip is what people install, so what goes into it is worth
          # printing where a release can be audited after the fact.
          Write-Host "--- native libraries in this release ---"
          Get-ChildItem hub\publish |
            Where-Object { $_.Name -match 'FLAC|ogg' } | Format-Table Name, Length

      - name: Zip it
        shell: pwsh
        run: |
          $name = "OpenAudioLink-Hub-win-x64-${{ steps.version.outputs.version }}.zip"
          Compress-Archive -Path hub/publish/* -DestinationPath $name
          "asset=$name" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
        id: package

      - uses: actions/download-artifact@v5
        with:
          name: firmware-release-files
          path: firmware-release

      # The rolling release is one build, not an archive.
      #
      # Uploading replaces an asset of the *same* name and leaves every
      # other one in place — and these names carry versions, so each build
      # added a file rather than replacing one. The API then returns them
      # in upload order, which makes the first the oldest. A Hub was
      # offered 0.7.0 and told it was up to date while 0.9.2 sat in the
      # same release.
      #
      # Both readers now pick the highest version rather than the first,
      # so this is belt as well as braces; but a release listing five old
      # builds is confusing to a person too.
      - name: Clear the rolling release's old assets
        if: steps.version.outputs.prerelease == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $existing = gh release view hub-latest --json assets -q '.assets[].name' 2>$null
          if (-not $existing) {
            Write-Host "No rolling release yet; nothing to clear."
            exit 0
          }
          foreach ($name in $existing) {
            if ($name) {
              Write-Host "Removing stale asset $name"
              gh release delete-asset hub-latest $name --yes 2>$null
            }
          }
          exit 0

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.name }}
          prerelease: ${{ steps.version.outputs.prerelease }}
          files: |
            ${{ steps.package.outputs.asset }}
            firmware-release/*
          # Never the newest thing on the releases page unless it is a
          # tagged one: somebody browsing should find a real release.
          make_latest: ${{ steps.version.outputs.prerelease == 'false' }}
          # The asset name is what update-hub.ps1 reads the version out of,
          # so it must keep the OpenAudioLink-Hub-win-x64-<version> shape.
          fail_on_unmatched_files: true
