name: librespot (Android)

# Built on demand and published on its own tag, exactly as the Windows
# build is (decision 18). librespot changes when *librespot* changes, never
# when OpenAudioLink does, and a cold Rust cross-build costs a quarter of an
# hour — so it is not attached to every push. One published build serves
# many phone releases.
#
# It is a separate artefact for the other reason too: whether running a
# reimplementation of somebody's streaming protocol is licensed for use
# with that service is the operator's decision. Keeping it on its own
# release keeps that decision visible instead of folding it into every
# build of the app.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "librespot version to build, e.g. 0.8.0"
        required: true
        default: "0.8.0"
      revision:
        description: "Packaging revision. Bump when the patch below changes."
        required: true
        default: "3"
      ndk:
        description: "NDK package to build with, pinned for reproducibility."
        required: true
        default: "27.2.12479018"

permissions:
  contents: write

jobs:
  build:
    name: aarch64-linux-android
    runs-on: ubuntu-latest
    steps:
      - name: Fetch librespot
        run: |
          git clone --depth 1 --branch "v${{ inputs.version }}" \
            https://github.com/librespot-org/librespot.git librespot

      - name: Identify as Linux, not Android
        working-directory: librespot
        # The one patch this build carries, and it is the difference
        # between OAuth working and Spotify refusing the sign-in.
        #
        # librespot picks a Spotify client ID from the target OS:
        # `default_for_os(OS)` maps "android" to Spotify's *Android app*
        # client ID. That client has no loopback redirect registered, so
        # the authorisation page ends in "redirect_uri: Not matching
        # configuration" — while the identical flow on the Windows Hub
        # works, because a desktop build gets KEYMASTER_CLIENT_ID, which
        # does have `http://127.0.0.1:5588/login` registered.
        #
        # Nothing on the command line can override it: librespot has no
        # --client-id option. So the platform is set here instead, which is
        # what the constant's own comment invites — "easily adjust the
        # current platform to mock the behavior on it". Setting OS rather
        # than the client ID alone keeps the two consistent: the client
        # token and login5 requests describe the same platform as the ID.
        run: |
          f=core/src/config.rs
          grep -q 'pub const OS: &str = std::env::consts::OS;' "$f"
          sed -i 's|pub const OS: &str = std::env::consts::OS;|pub const OS: \&str = "linux";  // OpenAudioLink: see librespot-android.yml|' "$f"
          grep -n 'pub const OS' "$f"

      - name: Pin the NDK
        # The runner exports an ANDROID_NDK_ROOT of whatever version its
        # image happens to carry that week, so a binary built here was
        # reproducible only by accident — and the property that matters
        # most (page alignment, below) is one the NDK version decides.
        # Pinning makes it a property of this repository instead.
        #
        # If the package name is wrong the step fails and prints what is
        # available; pass a different `ndk` input rather than editing this
        # file, since the right answer changes with the runner image.
        run: |
          set -euo pipefail
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if ! yes | "$sdkmanager" "ndk;${{ inputs.ndk }}" > /dev/null; then
            echo "::error::NDK ${{ inputs.ndk }} is not installable. Available:"
            "$sdkmanager" --list 2>/dev/null | grep -E '^\s+ndk;' | sort -u
            exit 1
          fi
          root="$ANDROID_HOME/ndk/${{ inputs.ndk }}"
          test -d "$root"
          # Both names, and both to a real path. The warning that used to
          # live on the build step was about setting ANDROID_NDK_HOME from
          # the workflow's `env` context, where a runner-set variable reads
          # as empty and overrides the good one. Writing an absolute path
          # to $GITHUB_ENV is a different thing and is safe.
          echo "ANDROID_NDK_ROOT=$root" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$root" >> "$GITHUB_ENV"
          echo "NDK: $root"

      - name: Rust for Android
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add aarch64-linux-android
          cargo install cargo-ndk --locked

      - name: Build
        working-directory: librespot
        env:
          # **16 KB page alignment, which Google Play requires.**
          #
          # Play rejects an app with `targetSdk` 35 or higher whose native
          # code is not laid out for 16 KB memory pages, and this binary
          # ships inside the APK as `liblibrespot.so`. Recent NDKs align
          # that way by default and older ones do not, so it is asked for
          # explicitly rather than inherited — the next step then proves
          # it rather than trusting either.
          #
          # It cannot be caught downstream: every phone this project is
          # developed on uses 4 KB pages, so a misaligned binary runs
          # perfectly here and is refused at upload.
          RUSTFLAGS: >-
            -C link-arg=-Wl,-z,max-page-size=16384
            -C link-arg=-Wl,-z,common-page-size=16384
        # No default features, and that is the whole trick.
        #
        #   * the default audio backend is rodio, which wants ALSA — there is
        #     no ALSA on Android. The `pipe` backend is compiled
        #     unconditionally, so dropping every backend feature still
        #     leaves the one this app uses.
        #   * the default TLS is native-tls, which wants OpenSSL. rustls
        #     with webpki roots is pure Rust and carries its own
        #     certificates, so nothing has to be cross-compiled in C and
        #     nothing depends on the phone's certificate store.
        #   * with-libmdns is the pure-Rust mDNS, which is what publishes
        #     the cast point. The alternative wants an Avahi daemon.
        #
        # --platform 26 matches the app's minSdk: a binary built against a
        # newer API than the phone provides fails to link at run time,
        # which on Android is a process that dies with no output at all.
        #
        # Spelled out, not -p. cargo-ndk 4 passes -p through to cargo as
        # --package, so the short form asks it to build a crate named "26"
        # and it panics saying so.
        run: |
          cargo ndk -t arm64-v8a --platform 26 build \
            --release --bin librespot \
            --no-default-features \
            --features "rustls-tls-webpki-roots,with-libmdns"

      - name: Name it as a library, and say why
        # Android refuses to execute a file from an app's data directory
        # (W^X, enforced since Android 10), but it will execute one from
        # the APK's native library directory. Anything matching lib*.so in
        # jniLibs lands there, so the executable travels under a library's
        # name. It is a PIE executable, not a shared object; the extension
        # is a packaging convention here, not a claim about the file.
        run: |
          mkdir -p out
          cp librespot/target/aarch64-linux-android/release/librespot \
             out/liblibrespot.so
          cd out
          sha256sum liblibrespot.so > liblibrespot.so.sha256
          ls -l
          file liblibrespot.so || true

      - name: Prove the 16 KB alignment
        # A linker flag that was accepted is not the same as a binary that
        # is aligned, and the difference is only visible here. Google Play
        # checks every LOAD segment; so does this, and it fails the build
        # rather than publishing a release that cannot be uploaded.
        run: |
          set -euo pipefail
          so=out/liblibrespot.so
          readelf="$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          [ -x "$readelf" ] || readelf=readelf
          echo "reading with $readelf"
          "$readelf" -l "$so" | tee headers.txt

          loads=$(awk '$1=="LOAD"' headers.txt | wc -l)
          if [ "$loads" -eq 0 ]; then
            echo "::error::no LOAD segments found — the check parsed nothing and cannot vouch for anything"
            exit 1
          fi

          bad=0
          while read -r align; do
            v=$(( align ))
            printf 'LOAD align %s = %d bytes\n' "$align" "$v"
            [ "$v" -ge 16384 ] || bad=1
          done < <(awk '$1=="LOAD"{print $NF}' headers.txt)

          if [ "$bad" -ne 0 ]; then
            echo "::error::liblibrespot.so is not 16 KB aligned. Google Play refuses this at upload, and no phone with 4 KB pages will show the fault. Check that the NDK accepted -Wl,-z,max-page-size=16384."
            exit 1
          fi
          echo "All $loads LOAD segments aligned to at least 16 KB."

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: librespot-android-v${{ inputs.version }}-${{ inputs.revision }}
          name: librespot ${{ inputs.version }} for Android (arm64), rev ${{ inputs.revision }}
          body: |
            librespot ${{ inputs.version }}, cross-compiled for
            `aarch64-linux-android` (arm64-v8a), API 26, with NDK
            `${{ inputs.ndk }}`.

            **16 KB page aligned**, linked with
            `-Wl,-z,max-page-size=16384` and verified segment by segment
            before this release was published. Google Play refuses native
            code that is not, for any app at `targetSdk` 35 or above, and
            no handset with 4 KB pages will show the fault — so it is
            checked at build time or not at all.

            **Patched in one place**, and the release is versioned
            separately because of it: `core/src/config.rs` reports the
            platform as `linux` rather than `android`. librespot chooses a
            Spotify client ID from that, and the Android one has no
            loopback redirect registered — so OAuth sign-in fails with
            "redirect_uri: Not matching configuration" while the same flow
            on a desktop build works. There is no command-line override.

            Built `--no-default-features --features
            "rustls-tls-webpki-roots,with-libmdns"`: no ALSA, no OpenSSL,
            pure-Rust mDNS. The `pipe` backend is compiled unconditionally,
            which is the one the phone app uses — it reads raw PCM from
            librespot's stdout, the same arrangement the Windows Hub uses.

            `liblibrespot.so` is an executable, not a shared object. It
            carries that name so it lands in the APK's native library
            directory, which is the only place Android will execute a file
            from.

            Not built by, endorsed by, or affiliated with Spotify. Whether
            running a reimplementation of their protocol is permitted with
            that service is the operator's decision — see
            `docs/CAST-POINTS.md`.
          files: |
            out/liblibrespot.so
            out/liblibrespot.so.sha256
          fail_on_unmatched_files: true
