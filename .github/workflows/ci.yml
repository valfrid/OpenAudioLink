name: CI

on:
  push:
    branches: ["main", "claude/**"]
  pull_request:
  # A Run workflow button. Actions had a bad afternoon -- jobs failing in
  # "Set up job" with Service Unavailable while resolving actions/checkout,
  # and the firmware job sitting fifteen minutes without a runner before
  # being cancelled -- and there was no way to ask for the build again
  # except by pushing a commit that changed nothing. Re-running the old run
  # is worse than it sounds: it deletes that run's artifacts first, so a
  # failed retry leaves you with less than you started with.
  workflow_dispatch:

jobs:
  # The phone app's wire format, pacing and control requests. Deliberately
  # free of Android, so this needs a JDK and nothing else -- the packets a
  # producer emits cannot be debugged by looking at a screen, and a build
  # that required an SDK would mean they were never checked here at all.
  # `settings.gradle.kts` leaves the Android module out when no SDK exists.
  phone-core:
    name: Phone core (host)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Wire format, pacing, discovery and control
        run: ./gradlew :core:test
        working-directory: phone
        env:
          # Hosted runners set ANDROID_HOME for every job, so without this
          # the core module's build would quietly configure the Android one
          # and the claim that these tests need no SDK would stop being
          # checked by anything.
          OAL_CORE_ONLY: "1"

  # The APK itself. Separate from phone-core because it needs an Android
  # SDK and the core deliberately does not -- and because this is the job
  # that can be red for a reason nobody can fix without one, which should
  # not take the wire-format tests down with it.
  #
  # It also produces the artefact a person installs: there is no store
  # listing yet, so a downloadable APK from a known commit is how this app
  # reaches a phone. A Play listing is planned -- docs/PLAY-STORE.md -- and
  # this job stays either way: a store release cycle is far too slow to
  # debug a speaker with, and the AAB will be an addition to this, on a
  # tag, not a replacement for it.
  phone-app:
    name: Phone APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # 17, not 21: it is the version the Android Gradle Plugin
          # supports without argument, and the app module is not where to
          # find out which JDKs it tolerates.
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: SDK components
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - name: Assemble
        run: ./gradlew :app:assembleDebug --stacktrace
        working-directory: phone

      # The version, in the artefact's name.
      #
      # Every build was called "openaudiolink-phone-debug", so a list of
      # them said nothing about which was which, and an APK already on a
      # phone could not be told from a new one. A person looking for the
      # build they were just told about found no such thing and reasonably
      # concluded it had not been built.
      - name: What version is this?
        id: phone-version
        working-directory: phone
        run: |
          v="$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts | head -1)"
          test -n "$v" || { echo "::error::no versionName in app/build.gradle.kts"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Phone app $v"

      # A green build is not proof that librespot is inside it.
      #
      # The fetch, the jniLibs directory and the packaging flag are three
      # separate things that each fail quietly: a task that did not run, a
      # directory the source set does not include, or a native library
      # stored in a way that leaves nothing on disk to exec. Any one of
      # them produces an APK that installs perfectly and whose Spotify
      # button does nothing -- and Spotify is what the phone hub is for.
      - name: Is librespot actually in the APK?
        working-directory: phone
        run: |
          apk="$(ls app/build/outputs/apk/debug/*.apk | head -1)"
          echo "APK: $apk ($(stat -c%s "$apk") bytes)"
          if ! unzip -l "$apk" | grep -q 'lib/arm64-v8a/liblibrespot\.so'; then
            echo "::error::liblibrespot.so is not in the APK — Spotify would do nothing"
            unzip -l "$apk" | grep -E 'lib/|\.so' || echo "(no native libraries at all)"
            exit 1
          fi
          unzip -l "$apk" | grep 'liblibrespot'
          # extractNativeLibs must be on, or there is no file to exec.
          "$ANDROID_HOME"/build-tools/35.0.0/aapt2 dump badging "$apk" \
            | grep -i "native-code\|extractNativeLibs" || true

      # Google Play refuses native code that is not laid out for 16 KB
      # pages, for any app at targetSdk 35 or above. It cannot be caught by
      # testing: every handset this project runs on uses 4 KB pages, so a
      # misaligned binary works perfectly and is refused at upload.
      #
      # The published binary already satisfies it -- all four LOAD segments
      # at 0x4000 -- so this fails rather than warns. It is a regression
      # detector: whatever produced an aligned binary was the runner's NDK
      # default rather than anything this repository asked for, and
      # librespot-android.yml now asks explicitly. If a future rebuild
      # comes back misaligned, the phone build stops here rather than at
      # the Play console.
      #
      # -W, and it is not cosmetic: without it GNU readelf wraps each
      # program header over two lines and the last field of a LOAD line is
      # an address, not the alignment.
      - name: Is librespot 16 KB page aligned?
        working-directory: phone
        run: |
          set -euo pipefail
          so=app/src/main/jniLibs/arm64-v8a/liblibrespot.so
          readelf -lW "$so" > headers.txt
          loads=$(awk '$1=="LOAD"' headers.txt | wc -l)
          if [ "$loads" -eq 0 ]; then
            echo "::error::no LOAD segments in $so — the check parsed nothing and cannot vouch for anything"
            exit 1
          fi
          bad=0
          while read -r align; do
            case "$align" in
              0x[0-9a-fA-F]*) ;;
              *) echo "::error::unparsable alignment '$align' — the header format changed"; exit 1 ;;
            esac
            printf 'LOAD align %s = %d bytes\n' "$align" "$(( align ))"
            [ "$(( align ))" -ge 16384 ] || bad=1
          done < <(awk '$1=="LOAD"{print $NF}' headers.txt)
          if [ "$bad" -ne 0 ]; then
            echo "::error::liblibrespot.so is not 16 KB page aligned. Google Play refuses the bundle, and no phone with 4 KB pages shows the fault. Rebuild with librespot-android.yml and point -Poal.librespot.revision at the tag it publishes."
            exit 1
          fi
          echo "All $loads LOAD segments aligned to at least 16 KB."

      - name: Name the file after the version too
        working-directory: phone/app/build/outputs/apk/debug
        run: |
          v="${{ steps.phone-version.outputs.version }}"
          for apk in *.apk; do
            mv "$apk" "openaudiolink-phone-$v-debug.apk"
          done
          ls -l

      - uses: actions/upload-artifact@v4
        with:
          name: openaudiolink-phone-${{ steps.phone-version.outputs.version }}-debug
          path: phone/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  hub:
    name: Hub (${{ matrix.os }})
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"
      - name: Build
        run: dotnet build --configuration Release
        working-directory: hub
      - name: Test
        run: dotnet test --configuration Release --no-build --logger "console;verbosity=normal"
        working-directory: hub

      # Compiling is not starting, and the difference has shipped a Hub
      # that would not come up: a PhysicalFileProvider throws on a missing
      # root while the pipeline is being built, and no unit test touches
      # the pipeline. Start it against a fresh empty data directory --
      # first-run conditions, where anything not created early enough is
      # missing -- and require it to answer.
      #
      # The address comes out of the Hub's own log rather than being
      # assumed. appsettings.json pins Urls, which beat ASPNETCORE_URLS
      # here and left the first version of this step curling a port
      # nothing was listening on -- reporting a failure against a Hub that
      # had started perfectly well.
      - name: Starts and answers (Linux)
        if: runner.os == 'Linux'
        working-directory: hub
        run: |
          set -uo pipefail
          data="$(mktemp -d)"
          Hub__DataDirectory="$data" \
            dotnet run --project src/OpenAudioLink.Hub --configuration Release \
            --no-build > hub.log 2>&1 &
          pid=$!

          url=""
          for _ in $(seq 1 60); do
            url="$(sed -n 's/.*Now listening on: \(http[^ ]*\).*/\1/p' hub.log | head -1)"
            [ -n "$url" ] && break
            kill -0 "$pid" 2>/dev/null || break
            sleep 1
          done
          # Kestrel prints the wildcard binding as [::]; ask it on loopback.
          url="$(printf '%s' "$url" | sed -e 's#\[::\]#127.0.0.1#' -e 's#//\*#//127.0.0.1#')"
          echo "Listening on: ${url:-<never announced>}"

          ok=0
          if [ -n "$url" ]; then
            for _ in $(seq 1 20); do
              if curl -fsS "$url/api/devices" > /dev/null 2>&1; then ok=1; break; fi
              kill -0 "$pid" 2>/dev/null || break
              sleep 1
            done
          fi

          # The log either way: a failure here is a startup exception and
          # the stack trace is the whole answer.
          cat hub.log
          kill "$pid" 2>/dev/null || true
          if [ "$ok" != "1" ]; then
            echo "::error::Hub did not start and answer on a fresh data directory"
            exit 1
          fi
          # And the feature that broke startup actually produced its
          # directory, rather than the route merely being skipped.
          if [ ! -d "$data/samples" ]; then
            echo "::error::Hub started but never created $data/samples"
            exit 1
          fi
          echo "Hub started, answered, and created its samples directory."

  hub-package:
    name: Hub win-x64 package
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"

      # ------------------------------------------------------------------
      # libFLAC, and why the Hub carries a native library at all.
      #
      # Windows decodes FLAC in its own container and has no Ogg demuxer,
      # and the FLAC that internet radio actually serves is Ogg-FLAC —
      # Icecast encapsulates it that way. So Media Foundation cannot play
      # the stations this was added for, and does not fail cleanly when
      # asked to: it sits on the open until something times it out.
      #
      # libFLAC handles both containers and, unlike every reader tried
      # before it, is built for a source that cannot seek: pass no seek
      # callback and it stops asking. That is exactly what a live station
      # is.
      #
      # Built here rather than committed, because a binary in a public
      # repository is a thing nobody can review. BSD-3-Clause, so shipping
      # it beside an MIT Hub is fine with the notice kept.
      #
      # This step is deliberately loud. Whether this particular build has
      # Ogg support compiled in is the one fact the whole approach rests
      # on, and it is not visible from the file name.
      # ------------------------------------------------------------------
      - name: Build libFLAC with Ogg support
        shell: pwsh
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install libflac:x64-windows
          if ($LASTEXITCODE -ne 0) { throw "vcpkg could not build libFLAC" }

          $bin = "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\bin"
          Write-Host "--- what was built ---"
          Get-ChildItem $bin -Filter *.dll | Format-Table Name, Length

          # The proof that matters. A libFLAC built without libogg still
          # exports the Ogg entry points; it just refuses at runtime with
          # UNSUPPORTED_CONTAINER. What it cannot fake is a dependency on
          # ogg.dll, so that is what gets checked.
          $dumpbin = Get-ChildItem `
            "C:\Program Files*\Microsoft Visual Studio\*\*\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" |
            Select-Object -First 1
          $flac = Get-ChildItem $bin -Filter "*FLAC*.dll" | Select-Object -First 1
          Write-Host "--- $($flac.Name) depends on ---"
          & $dumpbin.FullName /dependents $flac.FullName | Select-String -Pattern "\.dll"

      - name: Publish self-contained win-x64
        run: >
          dotnet publish src/OpenAudioLink.Hub --configuration Release
          --runtime win-x64 --self-contained true
          -p:PublishSingleFile=true
          --output publish
        working-directory: hub
      - name: Include the install and update scripts
        run: Copy-Item -Path scripts -Destination publish\scripts -Recurse
        working-directory: hub

      # Beside the executable, because that is where the runtime looks
      # first and the Hub is published as a single file with nowhere else
      # to put it. The licence travels with the binary — BSD asks for the
      # notice to be kept, and a DLL nobody can trace the terms of is
      # worse than no DLL.
      - name: Include libFLAC beside the Hub
        shell: pwsh
        run: |
          $root = "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows"

          # FLAC.dll and ogg.dll only. FLAC++.dll is the C++ wrapper and
          # nothing here speaks C++ — 88 kB of an installer for a binding
          # that will never be loaded.
          Copy-Item "$root\bin\FLAC.dll" hub\publish
          Copy-Item "$root\bin\ogg.dll" hub\publish

          # BSD asks that the notice travel with the binary, so a missing
          # licence fails the build rather than shipping quietly without
          # one. Where vcpkg keeps it has changed before now.
          $copyright = Get-ChildItem "$root\share" -Recurse -Filter copyright |
            Where-Object { $_.FullName -match 'flac' } | Select-Object -First 1
          if (-not $copyright) { throw "No libFLAC copyright file found under $root\share" }
          Copy-Item $copyright.FullName hub\publish\libFLAC-LICENSE.txt

          Write-Host "--- shipped beside the Hub ---"
          Get-ChildItem hub\publish |
            Where-Object { $_.Name -match '\.dll$|LICENSE' } | Format-Table Name, Length

      - name: What version is this?
        id: hub-version
        shell: bash
        run: |
          v="$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' hub/Directory.Build.props | head -1)"
          test -n "$v" || { echo "::error::no <Version> in hub/Directory.Build.props"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Hub $v"

      - uses: actions/upload-artifact@v5
        with:
          name: OpenAudioLink-Hub-win-x64-${{ steps.hub-version.outputs.version }}
          path: hub/publish

  # The RTP statistics are deliberately free of ESP-IDF headers so their
  # arithmetic can be tested without hardware or a cross toolchain. Wrong
  # counting here would send us chasing radio problems that are really
  # counting problems.
  rtp-stats:
    name: RTP packet, statistics and peer table (host)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Statistics
        working-directory: firmware/components/oal_rtp
        run: >
          cc -std=c11 -Wall -Wextra -Werror -Iinclude
          -o rtp-stats-tests oal_rtp_stats.c test/test_rtp_stats.c &&
          ./rtp-stats-tests
      - name: Packet format and synthetic source
        working-directory: firmware/components/oal_rtp
        run: >
          cc -std=c11 -Wall -Wextra -Werror -Iinclude
          -o rtp-packet-tests oal_rtp.c test/test_rtp_packet.c -lm &&
          ./rtp-packet-tests
      - name: Channel profile
        working-directory: firmware/components/oal_rtp
        run: >
          cc -std=c11 -Wall -Wextra -Werror -Iinclude
          -o channel-tests oal_channel.c test/test_channel.c &&
          ./channel-tests
      - name: Destination set
        working-directory: firmware/components/oal_rtp
        run: >
          cc -std=c11 -Wall -Wextra -Werror -Iinclude
          -o destination-tests oal_destinations.c test/test_destinations.c &&
          ./destination-tests
      - name: Output stage
        working-directory: firmware/components/oal_audio
        run: >
          cc -std=c11 -Wall -Wextra -Werror -Iinclude
          -o output-tests oal_output.c test/test_output.c &&
          ./output-tests
      - name: Fade ramps
        working-directory: firmware/components/oal_audio
        run: >
          cc -std=c11 -Wall -Wextra -Werror -Iinclude
          -o fade-tests oal_fade.c test/test_fade.c &&
          ./fade-tests
      - name: Input stage
        working-directory: firmware/components/oal_audio
        run: >
          cc -std=c11 -Wall -Wextra -Werror -Iinclude
          -o input-tests oal_input.c test/test_input.c &&
          ./input-tests
      - name: Playout thresholds
        working-directory: firmware/components/oal_audio
        run: >
          cc -std=c11 -Wall -Wextra -Werror -Iinclude
          -o threshold-tests test/test_thresholds.c &&
          ./threshold-tests
      - name: Playout phase tracker
        working-directory: firmware/components/oal_audio
        run: >
          cc -std=c11 -Wall -Wextra -Werror -Iinclude
          -o phase-tests oal_phase.c test/test_phase.c &&
          ./phase-tests
      - name: Room-correction filters
        working-directory: firmware/components/oal_audio
        run: >
          cc -std=c11 -Wall -Wextra -Werror -Iinclude
          -o eq-tests oal_eq.c test/test_eq.c -lm &&
          ./eq-tests
      - name: PCM conversion
        working-directory: firmware/components/oal_audio
        run: >
          cc -std=c11 -Wall -Wextra -Werror -Iinclude
          -o pcm-tests oal_pcm.c test/test_pcm.c -lm &&
          ./pcm-tests
      - name: Peer table
        working-directory: firmware/components/oal_discovery
        run: >
          cc -std=c11 -Wall -Wextra -Werror -Iinclude
          -o peer-tests oal_peers.c test/test_peers.c &&
          ./peer-tests
      - name: Controller election
        working-directory: firmware/components/oal_discovery
        run: >
          cc -std=c11 -Wall -Wextra -Werror -Iinclude
          -o election-tests oal_election.c test/test_election.c &&
          ./election-tests
      - name: Network choice
        working-directory: firmware/components/oal_wifi
        run: >
          cc -std=c11 -Wall -Wextra -Werror -Iinclude
          -o netpick-tests oal_netpick.c test/test_netpick.c &&
          ./netpick-tests

  firmware:
    name: Firmware testnode (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # ESP32-S3 only: the C3 was scaffolding while the S3 boards were in
        # transit, and decision 5 removes its target once S3 hardware is
        # verified. Two XIAO ESP32S3 nodes are up, so it is gone.
        target: [esp32s3]
    steps:
      - uses: actions/checkout@v5
      - name: Build with ESP-IDF
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.4
          target: ${{ matrix.target }}
          path: firmware/testnode
          command: >
            idf.py build &&
            cd build &&
            esptool.py --chip ${{ matrix.target }} merge_bin
            -o testnode-${{ matrix.target }}-flash.bin @flash_args &&
            cp oal_testnode.bin testnode-${{ matrix.target }}-ota.bin
      # The same argument as the phone's: a node's firmware version is the
      # thing that decides whether two readings are comparable, and it was
      # nowhere in the artefact's name.
      - name: What version is this?
        id: fw-version
        run: |
          v="$(tr -d '[:space:]' < firmware/testnode/version.txt)"
          test -n "$v" || { echo "::error::no firmware/testnode/version.txt"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Firmware $v"

      - uses: actions/upload-artifact@v5
        with:
          name: testnode-${{ matrix.target }}-${{ steps.fw-version.outputs.version }}
          path: |
            firmware/testnode/build/testnode-${{ matrix.target }}-flash.bin
            firmware/testnode/build/testnode-${{ matrix.target }}-ota.bin

