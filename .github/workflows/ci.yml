name: CI

on:
  push:
    branches: ["main", "claude/**"]
  pull_request:

jobs:
  hub:
    name: Hub (${{ matrix.os }})
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"
      - name: Build
        run: dotnet build --configuration Release
        working-directory: hub
      - name: Test
        run: dotnet test --configuration Release --no-build --logger "console;verbosity=normal"
        working-directory: hub

  hub-package:
    name: Hub win-x64 package
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"
      - name: Publish self-contained win-x64
        run: >
          dotnet publish src/OpenAudioLink.Hub --configuration Release
          --runtime win-x64 --self-contained true
          -p:PublishSingleFile=true
          --output publish
        working-directory: hub
      - name: Include service install scripts
        run: Copy-Item -Path scripts -Destination publish\scripts -Recurse
        working-directory: hub
      - uses: actions/upload-artifact@v5
        with:
          name: OpenAudioLink-Hub-win-x64
          path: hub/publish

  # The RTP statistics are deliberately free of ESP-IDF headers so their
  # arithmetic can be tested without hardware or a cross toolchain. Wrong
  # counting here would send us chasing radio problems that are really
  # counting problems.
  rtp-stats:
    name: RTP packet, statistics and peer table (host)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Statistics
        working-directory: firmware/components/oal_rtp
        run: >
          cc -std=c11 -Wall -Wextra -Werror -Iinclude
          -o rtp-stats-tests oal_rtp_stats.c test/test_rtp_stats.c &&
          ./rtp-stats-tests
      - name: Packet format and synthetic source
        working-directory: firmware/components/oal_rtp
        run: >
          cc -std=c11 -Wall -Wextra -Werror -Iinclude
          -o rtp-packet-tests oal_rtp.c test/test_rtp_packet.c -lm &&
          ./rtp-packet-tests
      - name: Peer table
        working-directory: firmware/components/oal_discovery
        run: >
          cc -std=c11 -Wall -Wextra -Werror -Iinclude
          -o peer-tests oal_peers.c test/test_peers.c &&
          ./peer-tests

  firmware:
    name: Firmware testnode (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # ESP32-S3 only: the C3 was scaffolding while the S3 boards were in
        # transit, and decision 5 removes its target once S3 hardware is
        # verified. Two XIAO ESP32S3 nodes are up, so it is gone.
        target: [esp32s3]
    steps:
      - uses: actions/checkout@v5
      - name: Build with ESP-IDF
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.3.1
          target: ${{ matrix.target }}
          path: firmware/testnode
          command: >
            idf.py build &&
            cd build &&
            esptool.py --chip ${{ matrix.target }} merge_bin
            -o testnode-${{ matrix.target }}-flash.bin @flash_args &&
            cp oal_testnode.bin testnode-${{ matrix.target }}-ota.bin
      - uses: actions/upload-artifact@v5
        with:
          name: testnode-${{ matrix.target }}
          path: |
            firmware/testnode/build/testnode-${{ matrix.target }}-flash.bin
            firmware/testnode/build/testnode-${{ matrix.target }}-ota.bin
