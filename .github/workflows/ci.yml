name: CI

on:
  push:
    branches: ["main", "claude/**"]
  pull_request:

jobs:
  hub:
    name: Hub (${{ matrix.os }})
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Build
        run: dotnet build --configuration Release
        working-directory: hub
      - name: Test
        run: dotnet test --configuration Release --no-build --logger "console;verbosity=normal"
        working-directory: hub

  hub-package:
    name: Hub win-x64 package
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Publish self-contained win-x64
        run: >
          dotnet publish src/OpenAudioLink.Hub --configuration Release
          --runtime win-x64 --self-contained true
          -p:PublishSingleFile=true
          --output publish
        working-directory: hub
      - uses: actions/upload-artifact@v4
        with:
          name: OpenAudioLink-Hub-win-x64
          path: hub/publish

  firmware:
    name: Firmware testnode (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [esp32c3, esp32s3]
    steps:
      - uses: actions/checkout@v4
      - name: Build with ESP-IDF
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.3.1
          target: ${{ matrix.target }}
          path: firmware/testnode
