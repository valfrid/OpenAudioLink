name: librespot

# Builds the Spotify Connect receiver the Hub drives (docs/LIBRESPOT.md).
#
# The librespot project does not publish Windows binaries and has declined
# to — issue #727, closed wontfix — so the alternative is every operator
# installing a Rust toolchain and several gigabytes of Visual Studio to
# produce a file that is identical on every machine. A runner that already
# has both does it once instead.
#
# On demand, not on every push. This builds a third-party program that
# changes when its version changes, never when this project does, and a
# cold Rust build costs about ten minutes of a Windows runner.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "librespot version to build (from crates.io)"
        default: "0.8.0"
        required: true
      publish:
        description: >
          Also attach the binary to a permanent release, so
          install-service.ps1 -WithLibrespot can fetch it without a login.
          The artifact below always needs one and expires after ninety
          days; a release asset does neither.
        type: boolean
        default: true
      features:
        description: >
          Cargo features. with-libmdns is librespot's own mDNS responder and
          is the default. with-dns-sd uses the system responder instead
          (Apple Bonjour on Windows) and is the fallback when libmdns
          announces correctly and nothing discovers it — see
          docs/LIBRESPOT.md. It may not build without the Bonjour SDK
          present, which is the thing to find out.
        default: "native-tls,with-libmdns"
        required: true

permissions:
  contents: write

jobs:
  windows:
    name: librespot win-x64
    runs-on: windows-latest
    steps:
      # The runner ships a Rust toolchain, but an old one would fail on a
      # newer librespot's minimum version rather than on anything real.
      - name: Use current stable Rust
        run: |
          rustup update stable
          rustup default stable
          rustc --version

      # --locked builds with the dependency versions librespot released
      # against. --no-default-features drops rodio-backend, which exists to
      # talk to a sound card this Hub does not want it talking to; the pipe
      # backend it does want is not behind a feature at all.
      #
      # with-libmdns must stay. It is what advertises each receiver on the
      # network, and without it the result runs perfectly and never appears
      # in the phone's Spotify list.
      - name: Build
        run: >
          cargo install librespot
          --version ${{ inputs.version }}
          --locked
          --no-default-features
          --features "${{ inputs.features }}"
          --root ${{ runner.temp }}\out

      # Proves the artifact is a program that runs, not just a file that
      # exists. A binary that cannot start is worth failing here rather
      # than on someone's Hub.
      - name: Check it runs
        run: ${{ runner.temp }}\out\bin\librespot.exe --version

      # So whoever downloads it can tell which build they have.
      - name: Record what was built
        shell: pwsh
        run: |
          $exe = "$env:RUNNER_TEMP\out\bin\librespot.exe"
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash
          $size = [math]::Round((Get-Item $exe).Length / 1MB, 1)
          @(
            "### librespot ${{ inputs.version }} (win-x64)"
            ""
            "| | |"
            "| --- | --- |"
            "| Size | $size MB |"
            "| SHA256 | ``$hash`` |"
            "| Features | ``${{ inputs.features }}`` (no default features) |"
            ""
            "Download the artifact below, unzip it, and put ``librespot.exe``"
            "beside the Hub executable. See docs/BUILDING-LIBRESPOT-WINDOWS.md."
          ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - uses: actions/upload-artifact@v5
        with:
          name: librespot-${{ inputs.version }}-win-x64
          path: ${{ runner.temp }}\out\bin\librespot.exe
          if-no-files-found: error

      # --- publishing ---------------------------------------------------
      #
      # A release of its own, tagged by librespot's version rather than the
      # Hub's. This program changes when its version changes and never when
      # this project does, so tying it to a Hub release would rebuild ten
      # minutes of Rust for every commit that touched a web page.
      #
      # It is deliberately a separate download and not part of the Hub
      # package. Whether a reimplementation of somebody's streaming
      # protocol is licensed for use with that service is the operator's
      # decision, not this project's (docs/CAST-POINTS.md); fetching it is
      # therefore an explicit act, behind an explicit flag.
      - name: Stage the release files
        if: inputs.publish
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          $exe = "$env:RUNNER_TEMP\out\bin\librespot.exe"
          Copy-Item $exe release\librespot-win-x64.exe
          # The checksum travels with it so the fetch script can verify what
          # it downloaded. An executable pulled over the network and run as
          # a service is exactly the thing worth checking.
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          "$hash  librespot-win-x64.exe" |
            Out-File -FilePath release\librespot-win-x64.exe.sha256 -Encoding ascii -NoNewline

      - uses: softprops/action-gh-release@v2
        if: inputs.publish
        with:
          tag_name: librespot-v${{ inputs.version }}
          name: librespot ${{ inputs.version }} (win-x64)
          body: |
            Built by this repository because the librespot project does not
            publish Windows binaries ([issue #727](https://github.com/librespot-org/librespot/issues/727),
            closed `wontfix`).

            Features: `${{ inputs.features }}`, no default features.

            Not part of the Hub package, and not installed unless asked
            for. See `docs/CAST-POINTS.md` for why, and
            `docs/INSTALLING-THE-HUB.md` for:

            ```powershell
            .\scripts\install-service.ps1 -WithLibrespot
            ```

            librespot is MIT-licensed and is not affiliated with Spotify.
          files: |
            release/librespot-win-x64.exe
            release/librespot-win-x64.exe.sha256
          # Never the newest thing on the releases page: that is the Hub,
          # and a person looking for something to download should find it.
          make_latest: false
          fail_on_unmatched_files: true
